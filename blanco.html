<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVERIX | Global Connectivity</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    
    <div class="noise"></div>

    <!-- PRELOADER -->
    <div id="preloader">
        <div id="counter">00</div>
    </div>

    <!-- NAVBAR / SIDEBAR INDUSTRIAL (¡Acá está la barra!) -->
    <div class="industrial-sidebar">
        <div class="side-logo">MAVERIX</div>
        <div class="sidebar-ruler">
            <div class="ruler-line"></div>
            <div class="ruler-progress" id="scrollProgress"></div>
            <div class="ruler-marks">
                <span>100</span><span>75</span><span>50</span><span>25</span><span>00</span>
            </div>
        </div>
        <div class="sidebar-links">
            <a href="#hero" class="side-item"><span>//</span> INICIO</a>
            <a href="#pillars" class="side-item"><span>//</span> PILARES</a>
            <a href="#metrics" class="side-item"><span>//</span> DATOS</a>
        </div>
    </div>

    <section class="hero" id="hero">
        <!-- Imagen enmarcada, estilo galería -->
        <div class="image-montage" id="montage">
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070');"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072');"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070');"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=2070');"></div>
        </div>

        <div class="hero-title-wrapper">
            <!-- Tu Logo -->
            <img src="/assets/images/logo-maverix.png" alt="Maverix Logo" class="hero-logo" id="heroLogo">
            
            <!-- EL CTA BRUTALISTA (¡Acá está el botón!) -->
            <a href="#contacto" class="brutalist-cta">
                INICIAR TRANSMISIÓN <span class="arrow">→</span>
            </a>
        </div>

        <!-- Footer técnico -->
        <div class="tech-footer" id="techFooter">
            <span class="fucsia-text">// DATA_STREAM: ACTIVE</span>
            <span>MENDOZA / ARG / GLOBAL</span>
        </div>

        <!-- Scroll -->
        <div class="scroll-explore" id="scrollExplore">
            <span>Scroll to Explore</span>
            <div class="scroll-arrow">↓</div>
        </div>
    </section>

    <!-- ACÁ ABAJO SIGUEN TUS SECCIONES: dictionary-section, pillars-section, etc. -->
    <script src="script.js"></script>
</body>
</html>
