<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVERIX | Experience</title>
    
    <link rel="stylesheet" href="/css/style2.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div class="noise"></div>

    <div id="preloader">
        <div class="grid-container" id="grid">
            </div>

        <div class="loader-content">
            <div class="counter" id="counter">00</div>
        </div>
    </div>

    <section class="hero" id="hero">
        <div class="vignette"></div>
        
        <div class="image-montage" id="montage">
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?q=80&w=1887');"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070');"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2070');"></div>
            <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1510511459019-5dee5926fd01?q=80&w=2070');"></div>
        </div>

      <div class="hero-title-wrapper">
        <div class="title-mask">
            <img src="/assets/images/logo-maverix.png" alt="Maverix Logo" class="hero-logo" id="heroLogo">
        </div>
      </div>
        <div class="scroll-explore" id="scrollExplore">
            <span>Scroll to explore</span>
            <div class="scroll-arrow">↓</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
