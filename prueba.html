<!-- NAVBAR (logo como imagen: /assets/images/logo.png) -->
<header class="mx-nav mx-nav--white" id="mxNav">
  <div class="mx-nav__inner">

    <!-- LOGO IMG -->
    <a href="#inicio" class="mx-nav__brand" aria-label="Ir al inicio">
      <img src="/assets/images/logo.png" alt="Maverix" class="mx-nav__logo-img">
    </a>

    <!-- LINKS -->
    <nav class="mx-nav__links" id="mxNavLinks" aria-label="Navegación principal">
      <a class="mx-nav__link" href="#inicio">Inicio</a>
      <a class="mx-nav__link" href="#servicios">Servicios</a>
      <a class="mx-nav__link" href="#proyectos">Proyectos</a>
      <a class="mx-nav__link" href="#somos">Somos</a>
      <a class="mx-nav__link mx-nav__cta" href="#contacto">Hablemos</a>
      <span class="mx-nav__indicator" id="mxNavInd"></span>
    </nav>

    <!-- MOBILE TOGGLE (opcional) -->
    <button class="mx-nav__toggle" id="mxNavToggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span>
    </button>

  </div>
</header>

<style>
:root{ --mx-accent:#ff385c; --mx-border:rgba(0,0,0,.08); }

/* base */
.mx-nav{
  position:fixed; inset:0 0 auto 0; z-index:100;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--mx-border);
  box-shadow:0 10px 26px rgba(0,0,0,.06);
}
.mx-nav__inner{
  max-width:1160px; margin:0 auto;
  padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}

/* logo img */
.mx-nav__brand{ display:inline-flex; align-items:center; text-decoration:none; }
.mx-nav__logo-img{ height:40px; width:auto; display:block; }

/* links */
.mx-nav__links{ position:relative; display:flex; align-items:center; gap:22px; }
.mx-nav__link{
  color:#111; text-decoration:none;
  font-size:12px; font-weight:900;
  text-transform:uppercase; letter-spacing:.18em;
  padding:8px 0;
  transition:transform .18s ease, color .18s ease, opacity .18s ease;
  opacity:.92;
}
.mx-nav__link:hover{ transform:translateY(-1px); color:var(--mx-accent); opacity:1; }

/* cta */
.mx-nav__cta{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--mx-accent);
  color:var(--mx-accent);
}
.mx-nav__cta:hover{
  background:var(--mx-accent);
  color:#fff;
}

/* indicator */
.mx-nav__indicator{
  position:absolute; left:0; bottom:0;
  height:2px; width:0; border-radius:999px;
  background:var(--mx-accent);
  opacity:0;
  transition:width .18s ease, transform .18s ease, opacity .18s ease;
}

/* mobile toggle (opcional) */
.mx-nav__toggle{
  display:none;
  width:30px; height:22px;
  border:0; background:transparent; padding:0; cursor:pointer;
  position:relative;
}
.mx-nav__toggle span{
  position:absolute; left:0; right:0;
  height:2px; border-radius:999px; background:#111;
  top:10px;
}
.mx-nav__toggle span:first-child{ top:5px; }
.mx-nav__toggle span:last-child{ top:15px; }

@media (max-width:860px){
  .mx-nav__toggle{ display:block; }
  .mx-nav__links{
    position:absolute; inset:100% 0 auto 0;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--mx-border);
    padding:14px 16px;
    flex-direction:column; align-items:flex-start; gap:12px;
    opacity:0; pointer-events:none; transform:translateY(-8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .mx-nav.is-open .mx-nav__links{
    opacity:1; pointer-events:auto; transform:translateY(0);
  }
  .mx-nav__indicator{ display:none; }
}
</style>

<script>
/* underline indicator */
(() => {
  const wrap = document.getElementById('mxNavLinks');
  const ind  = document.getElementById('mxNavInd');
  if(!wrap || !ind) return;

  const links = [...wrap.querySelectorAll('.mx-nav__link:not(.mx-nav__cta)')];
  const move = (el) => {
    const r = el.getBoundingClientRect();
    const pr = wrap.getBoundingClientRect();
    ind.style.width = r.width + 'px';
    ind.style.transform = `translateX(${r.left - pr.left}px)`;
    ind.style.opacity = 1;
  };

  links.forEach(a => a.addEventListener('mouseenter', ()=>move(a)));
  wrap.addEventListener('mouseleave', ()=> ind.style.opacity = 0);
  if(links[0]) move(links[0]);
})();

/* mobile toggle */
(() => {
  const nav = document.getElementById('mxNav');
  const btn = document.getElementById('mxNavToggle');
  if(!nav || !btn) return;

  btn.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
